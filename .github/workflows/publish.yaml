name: Publish main

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Set image tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="docker.io/kuberhealthy/cronjob-checker:${SHORT_SHA}"
          LATEST_IMAGE_TAG="docker.io/kuberhealthy/cronjob-checker:latest"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "LATEST_IMAGE_TAG=${LATEST_IMAGE_TAG}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.LATEST_IMAGE_TAG }}
      - name: Publish summary
        run: |
          TAG="${IMAGE_TAG#*:}"
          IMAGE_REPO="${IMAGE_TAG%:*}"
          HUB_REPO="${IMAGE_REPO#docker.io/}"
          IMAGE_URL="https://hub.docker.com/r/${HUB_REPO}/tags?name=${TAG}"
          LATEST_TAG="${LATEST_IMAGE_TAG#*:}"
          LATEST_IMAGE_REPO="${LATEST_IMAGE_TAG%:*}"
          LATEST_HUB_REPO="${LATEST_IMAGE_REPO#docker.io/}"
          LATEST_IMAGE_URL="https://hub.docker.com/r/${LATEST_HUB_REPO}/tags?name=${LATEST_TAG}"
          echo "Images pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${IMAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${LATEST_IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${LATEST_IMAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
